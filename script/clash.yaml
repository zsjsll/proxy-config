proxy-providers: 
  airport: 
    url: https://a.a.a/
    type: http
    interval: 43200
    health-check: 
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 1000
    proxy: DIRECT
mixed-port: 7890
socks-port: 7891
port: 7892
redir-port: 7893
tproxy-port: 7894
external-controller: 127.0.0.1:9999
secret: ""
allow-lan: true
bind-address: "*"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: silent
find-process-mode: "off"
disable-keep-alive: false
keep-alive-idle: 600
keep-alive-interval: 15
profile: 
  store-selected: true
  store-fake-ip: true
tun: 
  enable: true
  stack: mixed
  device: utun
  dns-hijack: 
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true
sniffer: 
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff: 
    HTTP: 
      ports: 
        - 80
        - 8080
      override-destination: true
    TLS: 
      ports: 
        - 443
        - 8443
    QUIC: 
      ports: 
        - 443
        - 8443
  force-domain: 
    - +.netflix.com
    - +.nflxvideo.net
    - +.amazonaws.com
    - +.media.dssott.com
  skip-domain: 
    - +.apple.com
    - Mijia Cloud
    - dlg.io.mi.com
    - +.oray.com
    - +.sunlogin.net
    - +.push.apple.com
dns: 
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter: 
    - "rule-set:geosite-fakeip_filter,geosite-cn,geosite-private,custom-direct"
  nameserver-policy: 
    "rule-set:geosite-ads,custom-reject": 
      - rcode://success
  default-nameserver: 
    - "https://223.5.5.5/dns-query#ecs=222.172.200.68/24&ecs-override=true"
    - "https://223.6.6.6/dns-query#ecs=222.172.200.68/24&ecs-override=true"
  proxy-server-nameserver: 
    - "https://223.5.5.5/dns-query#ecs=222.172.200.68/24&ecs-override=true"
    - "https://223.6.6.6/dns-query#ecs=222.172.200.68/24&ecs-override=true"
  direct-nameserver: 
    - system
    - 222.172.200.68
    - 61.166.150.123
    - 223.6.6.6
    - 223.5.5.5
  nameserver: 
    - "https://8.8.8.8/dns-query#ecs=222.172.200.68/24&ecs-override=true"
    - "https://8.8.4.4/dns-query#ecs=222.172.200.68/24&ecs-override=true"
proxy-groups-anchor: 
  auto_test: 
    type: url-test
    tolerance: 30
    interval: 600
    timeout: 1000
    include-all: true
    url: https://www.gstatic.com/generate_204
proxy-groups: 
  - name: 🚀 节点选择
    type: select
    proxies: 
      - ♻️ 自动选择
      - ✋ 手动选择
  - name: ✋ 手动选择
    type: select
    include-all: true
  - url: https://www.gstatic.com/generate_204
    include-all: true
    timeout: 1000
    interval: 600
    tolerance: 30
    type: url-test
    name: ♻️ 自动选择
  - name: 🚫 广告
    type: select
    proxies: 
      - 🔴 拒绝
      - 🟢 直连
  - name: 🎮 游戏CN
    type: select
    proxies: 
      - 🟢 直连
      - 🚀 节点选择
  - name: Ⓜ️ 微软CN
    type: select
    proxies: 
      - 🟢 直连
      - 🚀 节点选择
  - name: 🌈 谷歌CN
    type: select
    proxies: 
      - 🟢 直连
      - 🚀 节点选择
  - name: 🍎 苹果CN
    type: select
    proxies: 
      - 🟢 直连
      - 🚀 节点选择
  - name: 📋 BT下载
    type: select
    proxies: 
      - 🟢 直连
      - 🚀 节点选择
  - name: 📈 网络测试
    type: select
    proxies: 
      - 🟢 直连
      - 🚀 节点选择
      - ✋ 手动选择
  - name: 🤖 AI!CN
    type: select
    proxies: 
      - 🚀 节点选择
      - ✋ 手动选择
      - 🟢 直连
  - name: 🕹️ 游戏!CN
    type: select
    proxies: 
      - 🚀 节点选择
      - 🟢 直连
  - name: 🌍 媒体!CN
    type: select
    proxies: 
      - 🚀 节点选择
      - 🟢 直连
  - name: 🧱 海外FB
    type: select
    proxies: 
      - 🚀 节点选择
      - 🟢 直连
  - name: 🏠 国内FB
    type: select
    proxies: 
      - 🟢 直连
      - 🚀 节点选择
  - name: 🐟 漏网之鱼
    type: select
    proxies: 
      - 🚀 节点选择
      - 🟢 直连
  - name: 🟢 直连
    type: select
    proxies: 
      - DIRECT
    hidden: true
  - name: 🔴 拒绝
    type: select
    proxies: 
      - REJECT
    hidden: true
rules: 
  - "RULE-SET,custom-proxy,🧱 海外FB"
  - "RULE-SET,custom-direct,🏠 国内FB"
  - "RULE-SET,custom-reject,🚫 广告"
  - "RULE-SET,geosite-ads,🚫 广告"
  - "RULE-SET,geosite-private,DIRECT"
  - "RULE-SET,geosite-networktest,📈 网络测试"
  - "RULE-SET,geosite-trackerslist,📋 BT下载"
  - "RULE-SET,geosite-microsoft_cn,Ⓜ️ 微软CN"
  - "RULE-SET,geosite-apple_cn,🍎 苹果CN"
  - "RULE-SET,geosite-google_cn,🌈 谷歌CN"
  - "RULE-SET,geosite-games_cn,🎮 游戏CN"
  - "RULE-SET,geosite-ai,🤖 AI!CN"
  - "RULE-SET,geosite-games,🕹️ 游戏!CN"
  - "RULE-SET,geosite-media,🌍 媒体!CN"
  - "RULE-SET,geosite-tld_proxy,🧱 海外FB"
  - "RULE-SET,geosite-proxy,🧱 海外FB"
  - "RULE-SET,geosite-cn,🏠 国内FB"
  - "RULE-SET,geoip-private,DIRECT,no-resolve"
  - "RULE-SET,geoip-cn,🏠 国内FB"
  - "RULE-SET,geoip-media,🌍 媒体!CN"
  - "RULE-SET,geoip-telegram,🌍 媒体!CN,no-resolve"
  - "MATCH,🐟 漏网之鱼"
